schema_version: 1
id: great-blue-heron
display_name: Great Blue Heron
design_space:
  width: 120
  height: 90
  note: 'Normalized design space: character proportions are stage-independent; grid mapping scales by frame height
    (engine rigcore rule, from v1 rig.py).'
palette:
  white:
    rgb:
    - 255
    - 255
    - 255
    role: canvas
  ink:
    rgb:
    - 0
    - 0
    - 0
    role: 'ink: water marks, eye, shoulder patch, plume'
  outline:
    rgb:
    - 30
    - 48
    - 74
    role: outline dark navy
  slate:
    rgb:
    - 105
    - 130
    - 155
    role: body
  darkslate:
    rgb:
    - 66
    - 93
    - 122
    role: flight feathers / folded wing
  pale:
    rgb:
    - 176
    - 203
    - 224
    role: neck + chest fringe
  orange:
    rgb:
    - 240
    - 133
    - 36
    role: beak
  rusty:
    rgb:
    - 154
    - 82
    - 60
    role: thighs
  leg:
    rgb:
    - 74
    - 48
    - 36
    role: legs
  fish:
    rgb:
    - 150
    - 163
    - 105
    role: prey body
  fishback:
    rgb:
    - 94
    - 110
    - 66
    role: prey back
  fishbelly:
    rgb:
    - 216
    - 222
    - 182
    role: prey belly
pose_params:
  root_x:
    default: 30.0
  root_y:
    default: 0.0
  body_tilt:
    default: 0.0
  neck_coil:
    default: 0.0
  neck_extend:
    default: 0.0
  neck_sway:
    default: 0.0
  neck_retract:
    default: 0.0
  head_pitch:
    default: 0.0
  plume_sway:
    default: 0.0
  blink:
    default: 0.0
    kind: flag
  look_back:
    default: 0.0
    kind: flag
  wing_amt:
    default: 0.0
  flap:
    default: 0.0
  flying:
    default: 0.0
    kind: flag
  leg_far.fx:
    default: -2.0
  leg_far.fy:
    default: 86.0
  leg_near.fx:
    default: 5.0
  leg_near.fy:
    default: 86.0
  tail_ang:
    default: 0.0
  hide_near:
    default: 0.0
    kind: flag
  fish:
    default: none
    kind: discrete
    values:
    - none
    - held
    - free
  fish_size:
    default: tiny
    kind: discrete
    values:
    - tiny
    - big
  fish_ang:
    default: -65.0
  fish_slide:
    default: 0.0
  fish_x:
    default: 0.0
  fish_y:
    default: 0.0
  fish_free_ang:
    default: 0.0
anchors:
- name: beak_tip
  use: strike point; drip source; toss origin; spacing audits track it
- name: head
  use: alert/QA reference
life_layer:
- param: root_y
  waveform: sine
  period_s: 4.1
  amplitude: 0.3
  damped_by: neck_coil
  skip_when: flying
- param: neck_sway
  waveform: sine
  period_s: 5.7
  amplitude: 0.45
  damped_by: neck_coil
- param: plume_sway
  waveform: sine
  period_s: 3.3
  amplitude: 0.9
- param: head_pitch
  waveform: sine
  period_s: 6.9
  amplitude: 1.1
  damped_by: neck_coil
model_sheet: model_sheet.md
rig:
  module: rig.py
  render_fn: render
  default_pose_fn: default_pose
