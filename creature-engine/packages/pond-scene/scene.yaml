schema_version: 1
id: pond-scene
display_name: Pond Edge — frog + firefly (plug test)
environment: pond-edge
style: flat-storybook
grid: {width: 96, height: 72}
fps: 12
characters:
  - {id: frog, species: pond-frog, role: creature, start_zone: perch_mid}
  - {id: firefly, species: firefly, role: creature, start_zone: perch_mid}
inputs:
  raw:
    approach:           {kind: edge, source: "LD2410-class mmWave presence flag 0->1", description: "rising edge of presence"}
    presence_sustained: {kind: level, source: "mmWave presence flag held high", description: "someone is watching"}
    room_empty:         {kind: edge, source: "presence flag low continuously for >120 s", description: "the room has emptied"}
    ambient_light:      {kind: level, source: "BH1750-class lux sensor", description: "night dim/sleep. No camera, no microphone, ever."}
    button:             {kind: pulse, source: "the one physical button", description: "forces a croak at the pond"}
  derived_modes:
    unwatched: {enter: "default", priority: 0}
    watched:   {enter: "presence_sustained high", priority: 10}
    empty:     {enter: "room_empty fired", priority: 20}
    night:     {enter: "ambient_light below night threshold", priority: 30}
interactions:
  - id: frog-meets-firefly
    between: [frog, firefly]
    roles: [predator, prey]
    trigger: {kind: proximity, range_cells: 30}
    outcomes:
      - label: snap-catch
        weight: 3.0
        play: {frog: {clip_kind: tongue_snap}, firefly: {clip_kind: gone}}
        shared_events: [{type: snap, anchor_of: frog}]
      - label: watch-only
        weight: 1.0
        play: {frog: {clip_kind: alert}, firefly: {clip_kind: pulse}}
        shared_events: []
# Smoke episode: frog idles; the firefly drifts in (parallel track); the frog
# notices, snaps (the firefly's track switches to 'gone' at the catch), gives
# a satisfied croak, hops to the left perch — landing ripples the water band —
# and settles. Frame numbers were set from the built corpora's clip counts.
episode_script:
  - {of: frog, clip: idle_pond_0, presence: unwatched}
  - {of: firefly, clip: drift_in, at_frame: 30, presence: unwatched}
  - {of: frog, clip: alert_0, presence: unwatched}
  - {of: frog, clip: snap_r, presence: unwatched}
  - {of: firefly, clip: gone, at_frame: 95, presence: unwatched}
  - {of: frog, clip: croak_0, presence: unwatched}
  - {of: frog, clip: hop_mid_left, presence: unwatched}
  - {of: frog, clip: idle_left_0, frames: 48, presence: unwatched}
